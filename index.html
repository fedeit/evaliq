<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalIQ</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Atoms.jsx"></script>
<script type="text/babel" src="TeamDashboard.jsx"></script>
<script type="text/babel" src="EmployeeProfile.jsx"></script>
<script type="text/babel" src="PrepBrief.jsx"></script>
<script type="text/babel" src="PostMeetingLogger.jsx"></script>
<script type="text/babel" src="OneOnOnes.jsx"></script>
<script type="text/babel" src="AdminIntegrations.jsx"></script>
<script type="text/babel" src="UserSettings.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [route, setRoute] = useState('team');
  const [agent, setAgent] = useState(TEAM[0]);

  const openAgent = (a) => { setAgent(a); setRoute('profile'); };
  const openBrief = () => setRoute('brief');
  const openLogger = () => setRoute('logger');

  let screen;
  if (route === 'team') screen = <TeamDashboard openAgent={openAgent} />;
  else if (route === 'profile') screen = <EmployeeProfile a={agent} onBack={() => setRoute('team')} openBrief={openBrief} />;
  else if (route === 'brief') screen = <PrepBrief a={agent} onBack={() => setRoute('profile')} openLogger={openLogger} />;
  else if (route === 'logger') screen = <PostMeetingLogger a={agent} onBack={() => setRoute('brief')} onSave={() => setRoute('team')} />;
  else if (route === '1on1s') screen = <OneOnOnes openAgent={openAgent} openBrief={(a) => { setAgent(a); openBrief(); }} openLogger={(a) => { setAgent(a); openLogger(); }} />;
  else if (route === 'integrations') screen = <AdminIntegrations />;
  else if (route === 'settings') screen = <UserSettings />;

  return (
    <div className="app">
      <Sidebar route={route} setRoute={setRoute} />
      <div>
        <Header route={route} agent={agent} onBack={() => setRoute(route === 'profile' ? 'team' : 'profile')} />
        {screen}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
